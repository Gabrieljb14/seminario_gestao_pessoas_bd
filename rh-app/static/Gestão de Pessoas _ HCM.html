<style>
:root{--bg:#f3f5f7;--panel:#fff;--ink:#1f2d3a;--mut:#6b7a89;--line:#d5dce3;--rail:#2b3a42;--side:#3a4a53;--teal:#0f9d8a;--teal2:#0b7d6e;--sel:#e1f4f1;--red:#d93a3a;--head:#edf1f4}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171d22;--panel:#202830;--ink:#e4eaef;--mut:#93a1ae;--line:#34414c;--rail:#10161a;--side:#1b2329;--sel:#173a36;--head:#28323b}}
:root[data-theme=dark]{--bg:#171d22;--panel:#202830;--ink:#e4eaef;--mut:#93a1ae;--line:#34414c;--rail:#10161a;--side:#1b2329;--sel:#173a36;--head:#28323b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:13px/1.35 "Segoe UI",system-ui,Arial,sans-serif;display:flex}
#rail{width:48px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:4px}
#rail b{width:32px;height:32px;display:grid;place-items:center;color:#cfd8dc;border-radius:4px;font-size:16px;cursor:default}
#rail b.on{background:var(--teal);color:#fff}
#side{width:220px;background:var(--side);color:#e8eef1;display:flex;flex-direction:column}
#side .brand{background:var(--teal);color:#fff;padding:12px;font-weight:700;font-size:17px}
#side .ttl{padding:8px 10px;font-weight:600;border-bottom:1px solid #ffffff22;text-align:center;font-size:13px}
#side .crumb{padding:8px 12px;font-size:12px;color:#b8c5cc}
#side a{padding:10px 12px;color:#e8eef1;cursor:pointer;display:flex;justify-content:space-between;text-decoration:none}
#side a:hover{background:#ffffff14}#side a.on{background:#ffffff22;border-left:3px solid var(--teal);padding-left:9px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#top h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.2px}#top small{color:var(--mut);text-align:right}
#mdi{background:var(--head);padding:6px 10px 0;border-bottom:1px solid var(--line)}
#mdi span{display:inline-block;background:var(--panel);padding:5px 12px;border:1px solid var(--line);border-bottom:none;border-radius:3px 3px 0 0}
#work{flex:1;display:flex;min-height:0}
#form{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel);margin:8px;border:1px solid var(--line)}
#nav{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#nav input,#nav select,.f{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 6px;border-radius:2px;font:inherit}
#nav .id{width:70px;text-align:center}#nav .nm{flex:1;min-width:160px;font-weight:600}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--head)}
.tabs button{border:1px solid transparent;background:none;color:var(--ink);padding:6px 12px;cursor:pointer;font:inherit;white-space:nowrap}
.tabs button.on{background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel);color:var(--teal2);font-weight:600;margin-bottom:-1px}
#body{flex:1;overflow:auto;padding:14px 18px}
.row{display:flex;align-items:center;margin:5px 0;gap:8px}.row label{width:150px;text-align:right;color:var(--mut)}
.row .f{flex:0 1 380px;width:100%;min-height:26px;background:var(--bg)}
.row .f.s{flex-basis:130px}.row .d{color:var(--mut)}
.photo{float:right;width:110px;height:130px;border:1px solid var(--line);display:grid;place-items:center;font-size:46px;background:var(--head);color:var(--teal2);margin-left:12px}
table{border-collapse:collapse;width:100%}th{background:var(--head);text-align:left;position:sticky;top:0}
th,td{border:1px solid var(--line);padding:5px 8px;white-space:nowrap}tbody tr:hover{background:var(--sel)}tr.clk{cursor:pointer}
.wrap{overflow-x:auto;max-width:100%}
.badge{padding:1px 8px;border-radius:9px;background:var(--sel);color:var(--teal2);font-size:12px}.badge.r{background:#d93a3a22;color:var(--red)}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.kpi{border:1px solid var(--line);padding:8px 14px;background:var(--bg)}.kpi b{display:block;font-size:18px}
#btns{width:104px;padding:8px 8px 8px 0;display:flex;flex-direction:column;gap:6px}
#btns button,.bb button{border:1px solid var(--line);background:var(--head);color:var(--ink);padding:5px;cursor:pointer;font:inherit;border-radius:2px}
#btns button:disabled{opacity:.45;cursor:default}
.bb{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
.bb button.hl{border:2px solid var(--red)}
#status{background:var(--head);border-top:1px solid var(--line);padding:3px 12px;color:var(--mut);display:flex;justify-content:space-between}
.mut{color:var(--mut);padding:10px 0}
@media (max-width:820px){#side{display:none}#btns{display:none}.row{flex-direction:column;align-items:stretch;gap:2px}.row label{text-align:left;width:auto}.row .f{flex-basis:auto}}

 return `<div class="photo">${esc(x.nome_funcionario[0])}</div>`+row('Colaborador',x.id_funcionario,1)+row('Nome',x.nome_funcionario)+row('Data Admissão',ct?dt(ct.data_admissao_contrato):'')+row('Situação',I.sit[x.id_situacao].nome_situacao)+row('Cargo',c.id_cargo+' – '+c.nome_cargo)+row('Departamento',I.dep[c.id_departamento].nome_departamento)+row('Tipo Contrato',ct?ct.tipo_contrato:'')+row('Estado Civil',I.ec[x.id_estado_civil].nome_estado_civil)+row('Grau de Instrução',I.gr[x.id_grau_escolaridade].nome_grau_escolaridade)+row('CPF',x.cpf_funcionario)+row('E-mail',x.email_funcionario)+row('Telefone',x.telefone_funcionario)+row('Ativo',x.status_funcionario?'Sim':'Não',1)+
 `<h4>Endereço</h4>`+row('CEP',e.cep_endereco,1)+row('Logradouro',e.logradouro_endereco+', '+e.numero_endereco+(e.complemento_endereco?' – '+e.complemento_endereco:''))+row('Bairro',e.bairro_endereco)+row('Cidade/UF',e.cidade_endereco+' / '+e.uf_endereco)},
'Dependentes'(x){const r=D.funcionario_dependente.filter(k=>k.id_funcionario==x.id_funcionario).map(k=>({...I.dpd[k.id_dependente],p:k.grau_parentesco}));
 return tbl([['Código',a=>a.id_dependente],['Nome',a=>esc(a.nome_dependente)],['Parentesco',a=>esc(a.p)],['Nascimento',a=>dt(a.data_nascimento_dependente)],['Idade',a=>age(a.data_nascimento_dependente)],['CPF',a=>a.cpf_dependente]],r)},
'Contratos'(x){return tbl([['Código',a=>a.id_contrato],['Tipo',a=>a.tipo_contrato],['Admissão',a=>dt(a.data_admissao_contrato)],['Demissão',a=>dt(a.data_demissao_contrato)],['Tempo',a=>dif(a.data_admissao_contrato,a.data_demissao_contrato)],['Salário',a=>brl(a.salario_contrato)]],D.contratos.filter(k=>k.id_funcionario==x.id_funcionario))},
'Salários'(x){return tbl([['Código',a=>a.id_salario],['Valor',a=>brl(a.valor_salario)],['Início',a=>dt(a.data_inicio_salario)],['Fim',a=>dt(a.data_fim_salario)],['Situação',a=>a.data_fim_salario?'<span class="badge r">Encerrado</span>':'<span class="badge">Atual</span>']],D.salarios.filter(k=>k.id_funcionario==x.id_funcionario))},
'Histórico de Cargos'(x){return tbl([['Cargo',a=>esc(I.cargo[a.id_cargo].nome_cargo)],['Departamento',a=>esc(I.dep[I.cargo[a.id_cargo].id_departamento].nome_departamento)],['Início',a=>dt(a.data_inicio_cargo)],['Fim',a=>dt(a.data_fim_cargo)]],D.historico_cargos.filter(k=>k.id_funcionario==x.id_funcionario))},
'Férias'(x){return tbl([['Código',a=>a.id_ferias],['Início',a=>dt(a.data_inicio_ferias)],['Fim',a=>dt(a.data_fim_ferias)],['Dias',a=>Math.round((new Date(a.data_fim_ferias)-new Date(a.data_inicio_ferias))/864e5)+1]],D.ferias.filter(k=>k.id_funcionario==x.id_funcionario))},
'Benefícios'(x){const ids=D.contratos.filter(k=>k.id_funcionario==x.id_funcionario).map(k=>k.id_contrato);
 return tbl([['Contrato',a=>a.id_contrato],['Benefício',a=>esc(I.ben[a.id_beneficio].nome_beneficio)],['Valor',a=>brl(a.valor_beneficio)],['Valor padrão',a=>brl(I.ben[a.id_beneficio].valor_padrao_beneficio)]],D.contrato_beneficio.filter(k=>ids.includes(k.id_contrato)))},
'Atribuições'(x){return tbl([['Atribuição',a=>esc(I.atr[a.id_atribuicao].nome_atribuicao)],['Descrição',a=>esc(I.atr[a.id_atribuicao].descricao_atribuicao)]],D.cargo_atribuicao.filter(k=>k.id_cargo==x.id_cargo))}};
function emp(){const x=f();document.getElementById('form').innerHTML=
`<div id="nav"><label>Colaborador:</label><input class="id" id="gid" value="${x.id_funcionario}"><input class="nm" readonly value="${esc(x.nome_funcionario)}"><select id="sel" class="f"><option value="">Buscar colaborador…</option>${F.map((y,i)=>`<option value="${i}">${y.id_funcionario} – ${esc(y.nome_funcionario)}</option>`).join('')}</select></div>
<div class="tabs">${Object.keys(TABS).map(t=>`<button class="${t==tab?'on':''}" data-t="${t}">${t}</button>`).join('')}</div>
<div id="body">${TABS[tab](x)}</div>
<div class="bb"><button data-t="Dependentes" class="hl">1-Dependentes</button><button data-t="Salários">2-Salários</button><button data-t="Contratos">3-Contratos</button><button data-t="Férias">4-Férias</button><button data-t="Benefícios">5-Benefícios</button><button id="bl">6-Lista</button></div>`;
 const g=id=>document.getElementById(id);
 g('gid').onchange=e=>{const i=F.findIndex(y=>y.id_funcionario==e.target.value);if(i>=0){cur=i}emp()};
 g('sel').onchange=e=>{if(e.target.value!==''){cur=+e.target.value;emp()}};
 g('bl').onclick=()=>show('lista');
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;emp()})}
function lista(){document.getElementById('form').innerHTML=`<div id="nav"><input class="nm" id="q" placeholder="Pesquisar por nome, CPF, cargo ou departamento…"></div><div id="body"></div>`;
 const draw=()=>{const q=document.getElementById('q').value.toLowerCase();const r=F.map((x,i)=>({x,i})).filter(({x})=>(x.nome_funcionario+x.cpf_funcionario+cg(x).nome_cargo+I.dep[cg(x).id_departamento].nome_departamento).toLowerCase().includes(q));
 const b=document.getElementById('body');b.innerHTML=tbl([['Cód.',a=>a.x.id_funcionario],['Nome',a=>esc(a.x.nome_funcionario)],['CPF',a=>a.x.cpf_funcionario],['Cargo',a=>esc(cg(a.x).nome_cargo)],['Departamento',a=>esc(I.dep[cg(a.x).id_departamento].nome_departamento)],['Situação',a=>esc(I.sit[a.x.id_situacao].nome_situacao)]],r,1);
 b.querySelectorAll('tr.clk').forEach(t=>t.onclick=()=>{cur=r[+t.dataset.i].i;tab='Básica';show('emp')})};
 document.getElementById('q').oninput=draw;draw()}
function dep(){const rows=D.departamentos.map(d=>{const cs=D.cargos.filter(c=>c.id_departamento==d.id_departamento).map(c=>c.id_cargo);const fs=F.filter(x=>cs.includes(x.id_cargo));const sal=D.salarios.filter(s=>!s.data_fim_salario&&fs.some(x=>x.id_funcionario==s.id_funcionario)).map(s=>+s.valor_salario);return{d,n:fs.length,m:sal.length?sal.reduce((a,b)=>a+b)/sal.length:0,t:sal.reduce((a,b)=>a+b,0)}});
 document.getElementById('form').innerHTML=`<div id="body"><div class="kpis"><div class="kpi">Colaboradores<b>${F.length}</b></div><div class="kpi">Departamentos<b>${D.departamentos.length}</b></div><div class="kpi">Folha atual<b>${brl(rows.reduce((a,r)=>a+r.t,0))}</b></div></div>`+tbl([['Departamento',a=>esc(a.d.nome_departamento)],['Descrição',a=>esc(a.d.descricao_departamento)],['Colaboradores',a=>a.n],['Média salarial atual',a=>brl(a.m)],['Total',a=>brl(a.t)]],rows)+'</div>'}
function cargos(){document.getElementById('form').innerHTML='<div id="body">'+tbl([['Cód.',a=>a.id_cargo],['Cargo',a=>esc(a.nome_cargo)],['Departamento',a=>esc(I.dep[a.id_departamento].nome_departamento)],['Colaboradores',a=>F.filter(x=>x.id_cargo==a.id_cargo).length]],D.cargos)+'</div>'}
function ben(){document.getElementById('form').innerHTML='<div id="body">'+tbl([['Cód.',a=>a.id_beneficio],['Benefício',a=>esc(a.nome_beneficio)],['Descrição',a=>esc(a.descricao_beneficio)],['Valor padrão',a=>brl(a.valor_padrao_beneficio)]],D.beneficios)+'</div>'}
const V={emp:['Empregados',emp],lista:['Empregados – Lista',lista],dep:['Departamentos',dep],cargos:['Cargos',cargos],ben:['Benefícios',ben]};
const M=[['emp','Empregados'],['lista','Lista de Colaboradores'],['dep','Departamentos'],['cargos','Cargos'],['ben','Benefícios']];
function show(v){view=v;document.getElementById('mdit').textContent=V[v][0];document.getElementById('menu').innerHTML=M.map(([k,l])=>`<a class="${k==v?'on':''}" data-v="${k}">${l}<span>☆</span></a>`).join('');document.querySelectorAll('#menu a').forEach(a=>a.onclick=()=>show(a.dataset.v));V[v][1]()}
bPrev.onclick=()=>{if(view=='emp'){cur=(cur-1+F.length)%F.length;emp()}};bNext.onclick=()=>{if(view=='emp'){cur=(cur+1)%F.length;emp()}};bList.onclick=()=>show('lista');
th.onclick=e=>{e.preventDefault();const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
show('emp');
</script></body></html>
