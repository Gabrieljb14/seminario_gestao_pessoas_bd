<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de RH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#13a89e;--rail:#2e2e2e;--rail-on:#1b1b1b;--bg:#f0f0f0;--card:#fff;--line:#dcdcdc;--text:#4a4a4a;--muted:#8a8a8a;
--blue:#2878b5;--blue-soft:#a8cbe6;--slate:#6b8294;--hover:#efefef;--danger:#c0392b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Open Sans","Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg);display:flex}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* rail */
.rail{width:64px;background:var(--rail);display:flex;flex-direction:column;flex:none}
.logo{height:56px;background:var(--teal);display:grid;place-items:center}
.rail nav{flex:1;display:flex;flex-direction:column;padding-top:12px}
.rail button{height:56px;border:0;background:none;color:#cfcfcf;cursor:pointer;display:grid;place-items:center;position:relative}
.rail button:hover{color:#fff}
.rail button.on{background:var(--rail-on);color:#fff}
.rail button.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal)}
.rail svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.avatar{margin:10px auto 12px;width:44px;height:44px;border-radius:50%;background:#d8d8d8;display:grid;place-items:center;color:#8a8a8a;font-weight:700}

/* content */
main{flex:1;min-width:0;overflow:auto;padding:22px 16px 40px}
h1{font-size:24px;font-weight:400;margin:0 0 2px;padding-left:2px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin:0 0 16px 2px}
.crumb svg{width:14px;height:14px;stroke:var(--blue);fill:none;stroke-width:2}
.card{background:var(--card);border:1px solid var(--line);margin-bottom:16px}
.card>header{padding:18px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card h2{margin:0;font-size:16px;font-weight:400;text-transform:uppercase;letter-spacing:.01em;flex:1;min-width:160px}
.body{padding:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto;margin-top:8px}
.tabs button{border:0;background:none;padding:12px 18px;font-weight:600;color:var(--blue);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--blue)}
.tools{display:flex;gap:10px;padding:16px;align-items:center}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:8px 11px;border:1px solid #c9c9c9;border-radius:3px;background:#fff;min-height:36px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:0}
.tools input{max-width:360px}
.btn{border:0;border-radius:3px;padding:9px 20px;font-weight:600;cursor:pointer;background:var(--slate);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.primary{background:var(--blue)}
.btn:disabled{background:var(--blue-soft);cursor:not-allowed;filter:none}
.link{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;padding:9px 12px}
.spacer{flex:1}

/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid #e8e8e8;white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
tbody tr.row{cursor:pointer}
tbody tr.row:hover,tbody tr.row.sel{background:var(--hover)}
td.num{text-align:right;font-variant-numeric:tabular-nums}th.num{text-align:right}
td.act{width:48px;text-align:right;padding-right:16px}
.trash{border:0;background:none;color:#7d93a5;cursor:pointer;padding:4px;border-radius:3px;display:inline-grid}
.trash:hover{color:var(--danger);background:#fbe9e7}
.trash svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.badge{padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600;background:#e2f3f1;color:#0c7a72}
.badge.off{background:#eee;color:#777}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.foot{padding:10px 16px;color:var(--muted);font-size:12px}

/* reports */
.rep{display:grid;grid-template-columns:300px 1fr;min-height:360px}
.rep aside{border-right:1px solid var(--line);padding:8px 0}
.rep aside h3{margin:12px 16px 4px;font-size:12px;color:var(--muted);font-weight:600}
.rep aside button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 16px;cursor:pointer;line-height:1.35}
.rep aside button:hover,.rep aside button.on{background:var(--hover)}
.rep aside button.on{box-shadow:inset 3px 0 var(--blue);font-weight:600}
.rep section h3{margin:0;padding:16px 16px 0;font-size:15px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:#fff;box-shadow:-4px 0 18px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;z-index:5}
.drawer.on{transform:none}
.drawer header{padding:20px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.drawer h2{margin:0;font-size:16px;font-weight:700;text-transform:uppercase;flex:1;display:flex;align-items:center;gap:8px}
.drawer h2 svg{width:15px;height:15px}
.x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;padding:0 4px}
.drawer form{flex:1;overflow:auto;padding:0 20px 20px}
.drawer .tabs{padding:0;margin:14px 0 18px}
.f{margin-bottom:16px}
.f label{display:block;margin-bottom:5px}
.f .req{color:var(--text)}
.f small{display:block;color:var(--danger);margin-top:3px}
.f.ro input,.f.ro select{background:#f4f4f4}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:36px}
.sw input{width:18px;height:18px;accent-color:var(--teal)}
.dfoot{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#333;color:#fff;padding:11px 20px;border-radius:3px;opacity:0;transition:.2s;z-index:9;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--danger)}
dialog{border:0;border-radius:4px;padding:24px;max-width:420px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.3)}
dialog p{margin:0 0 20px}
dialog .dfoot{padding:0;border:0;justify-content:flex-end}

@media (max-width:720px){.rail{width:52px}.rep{grid-template-columns:1fr}.rep aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:16px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="rail">
  <div class="logo" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 30 30" style="fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round"><path d="M20 7c-1.500-1.500-4-2-6-1.200M10 11c0 4 10 3 10 8 0 3-4.500 4.500-9 2.500"/></svg></div>
  <nav id="rail" aria-label="Módulos"></nav>
  <div class="avatar" title="Usuário">RH</div>
</div>
<main>
  <h1 id="title"></h1>
  <div class="crumb"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span id="crumb"></span></div>
  <div id="view"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<dialog id="dlg"><p id="dlgText"></p><div class="dfoot"><button class="link" id="dlgNo">Cancelar</button><button class="btn" id="dlgYes">Excluir</button></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = d => `<svg viewBox="0 0 24 24">${d}</svg>`;
const ICONS = {
  pessoas: ic('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>'),
  org: ic('<rect x="9" y="3" width="6" height="5"/><rect x="2" y="16" width="6" height="5"/><rect x="16" y="16" width="6" height="5"/><path d="M12 8v4M5 16v-4h14v4"/>'),
  money: ic('<circle cx="12" cy="12" r="9"/><path d="M15 9c-.5-1.2-1.7-2-3-2-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.300-1.300 2.200-3 2.200-1.400 0-2.600-.8-3.100-2M12 5.500V7m0 10v1.500"/>'),
  list: ic('<path d="M8 6h13M8 12h13M8 18h13M3.500 6h.01M3.500 12h.01M3.500 18h.01"/>'),
  chart: ic('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>',
  info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M12 11v6M12 7.500v.01" stroke="#fff" stroke-width="2.500" stroke-linecap="round"/></svg>'
};
const MODULES = [
  {id:"pessoas", name:"Pessoas", icon:"pessoas", tables:["funcionarios","dependentes","funcionario_dependente","enderecos"]},
  {id:"org", name:"Organização", icon:"org", tables:["departamentos","cargos","atribuicoes","cargo_atribuicao","historico_cargos"]},
  {id:"rem", name:"Remuneração", icon:"money", tables:["contratos","salarios","beneficios","contrato_beneficio","ferias"]},
  {id:"cad", name:"Cadastros", icon:"list", tables:["situacoes","graus_escolaridade","estados_civis"]},
  {id:"rel", name:"Consultas", icon:"chart", tables:[]}
];
const TITLES = {funcionarios:"Funcionários",dependentes:"Dependentes",funcionario_dependente:"Vínculos de dependentes",enderecos:"Endereços",
  departamentos:"Departamentos",cargos:"Cargos",atribuicoes:"Atribuições",cargo_atribuicao:"Atribuições do cargo",historico_cargos:"Histórico de cargos",
  contratos:"Contratos",salarios:"Salários",beneficios:"Benefícios",contrato_beneficio:"Benefícios do contrato",ferias:"Férias",
  situacoes:"Situações",graus_escolaridade:"Graus de escolaridade",estados_civis:"Estados civis"};
const SINGULAR = {funcionarios:"Funcionário",dependentes:"Dependente",funcionario_dependente:"Vínculo",enderecos:"Endereço",departamentos:"Departamento",cargos:"Cargo",
  atribuicoes:"Atribuição",cargo_atribuicao:"Atribuição do cargo",historico_cargos:"Histórico de cargo",contratos:"Contrato",salarios:"Salário",beneficios:"Benefício",
  contrato_beneficio:"Benefício do contrato",ferias:"Férias",situacoes:"Situação",graus_escolaridade:"Grau de escolaridade",estados_civis:"Estado civil"};
const WORDS = {admissao:"admissão",demissao:"demissão",descricao:"descrição",situacao:"situação",atribuicao:"atribuição",endereco:"endereço",salario:"salário",
  beneficio:"benefício",ferias:"férias",numero:"número",padrao:"padrão",inicio:"início",funcionario:"funcionário",civil:"civil",cpf:"CPF",cep:"CEP",uf:"UF",
  nascimento:"nascimento",escolaridade:"escolaridade",email:"e-mail",fim:"fim"};
const ENTITY = new Set("funcionario cargo departamento atribuicao endereco situacao beneficio contrato dependente salario ferias".split(" "));
function label(c){
  let w = c.name.replace(/^id_/, "").split("_");
  if (!c.fk && w.length > 1 && ENTITY.has(w.at(-1))) w.pop();
  w = w.map(x => WORDS[x] || x);
  if (w[0] === "data" && w.length > 1) w.splice(1, 0, "de"), w[2] = w[2];
  let s = w.join(" "); return s.charAt(0).toUpperCase() + s.slice(1);
}
const brl = v => v == null ? "" : Number(v).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const dt = v => v ? v.split("-").reverse().join("/") : "";
const isMoney = c => /^(valor|salario)/.test(c.name) && c.type === "REAL";
const isBool = c => c.type === "BOOLEAN";
const isDate = c => c.type === "DATE";

let S = {}, mod = MODULES[0], table = "funcionarios", rows = [], q = "", reps = [], rep = null, ed = null, dirty = false, opts = {};

async function api(path, method = "GET", body){
  const r = await fetch("/api/" + path, {method, headers:{"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || "Erro inesperado"); return j;
}
function toast(m, err){ const t = $("#toast"); t.textContent = m; t.className = "toast on" + (err ? " err" : ""); clearTimeout(t._t); t._t = setTimeout(() => t.className = "toast", 2800); }
function confirmDlg(text){ return new Promise(res => { const d = $("#dlg"); $("#dlgText").textContent = text; d.showModal(); $("#dlgYes").onclick = () => { d.close(); res(true); }; $("#dlgNo").onclick = () => { d.close(); res(false); }; }); }

/* ---------- navegação ---------- */
function renderRail(){
  $("#rail").innerHTML = MODULES.map(m => `<button class="${m.id === mod.id ? "on" : ""}" data-m="${m.id}" title="${m.name}" aria-label="${m.name}">${ICONS[m.icon]}</button>`).join("");
  $("#rail").onclick = e => { const b = e.target.closest("button"); if (!b) return; mod = MODULES.find(m => m.id === b.dataset.m); table = mod.tables[0]; q = ""; go(); };
}
async function go(){
  closeDrawer(true); renderRail();
  $("#title").textContent = mod.name; $("#crumb").textContent = mod.name + (mod.id === "rel" ? "" : " › " + TITLES[table]);
  document.title = mod.name + " · Gestão de RH";
  mod.id === "rel" ? await viewReports() : await viewTable();
}

/* ---------- listagem ---------- */
function listCols(){
  const t = S[table]; let cols = t.cols.filter(c => !(t.auto && c.pk));
  if (table === "funcionarios") cols = ["nome_funcionario","email_funcionario","id_cargo","id_situacao","status_funcionario"].map(n => cols.find(c => c.name === n));
  return cols.slice(0, 6);
}
const cell = (c, r) => c.fk ? esc(r[c.name + "__label"]) : isBool(c) ? `<span class="badge ${r[c.name] ? "" : "off"}">${r[c.name] ? "Ativo" : "Inativo"}</span>` : isMoney(c) ? brl(r[c.name]) : isDate(c) ? dt(r[c.name]) : esc(r[c.name]);
const pkOf = r => Object.fromEntries(S[table].pk.map(k => [k, r[k]]));

async function viewTable(){
  const tabs = mod.tables.map(t => `<button class="${t === table ? "on" : ""}" data-t="${t}">${TITLES[t]}</button>`).join("");
  $("#view").innerHTML = `<div class="card"><div class="tabs" id="tabs" style="margin-top:0;padding-top:8px">${tabs}</div>
    <div class="tools"><input type="search" id="q" placeholder="Pesquisar em ${TITLES[table].toLowerCase()}" aria-label="Pesquisar" value="${esc(q)}"><span class="spacer"></span><button class="btn" id="new">Adicionar</button></div>
    <div class="tw" id="grid"></div><div class="foot" id="count"></div></div>`;
  $("#tabs").onclick = e => { const b = e.target.closest("button"); if (b){ table = b.dataset.t; q = ""; go(); } };
  $("#new").onclick = () => openDrawer(null);
  let tm; $("#q").oninput = e => { q = e.target.value; clearTimeout(tm); tm = setTimeout(load, 220); };
  await load();
}
async function load(){
  rows = await api(`rows/${table}?q=${encodeURIComponent(q)}`);
  const cols = listCols();
  $("#grid").innerHTML = rows.length ? `<table><thead><tr>${cols.map(c => `<th class="${isMoney(c) ? "num" : ""}">${label(c)}</th>`).join("")}<th></th></tr></thead><tbody>${
    rows.map((r, i) => `<tr class="row" data-i="${i}" tabindex="0">${cols.map(c => `<td class="${isMoney(c) ? "num" : ""}">${cell(c, r)}</td>`).join("")}<td class="act"><button class="trash" data-del="${i}" aria-label="Excluir">${ICONS.trash}</button></td></tr>`).join("")}</tbody></table>`
    : `<div class="empty">${q ? "Nenhum resultado para “" + esc(q) + "”. Tente outro termo." : "Nenhum registro ainda. Use Adicionar para criar o primeiro."}</div>`;
  $("#count").textContent = rows.length + (rows.length === 1 ? " registro" : " registros");
  $("#grid").onclick = async e => {
    const d = e.target.closest("[data-del]");
    if (d) return remove(rows[d.dataset.del]);
    const tr = e.target.closest("tr.row"); if (tr) openDrawer(rows[tr.dataset.i]);
  };
  $("#grid").onkeydown = e => { if (e.key === "Enter" && e.target.matches("tr.row")) openDrawer(rows[e.target.dataset.i]); };
}
async function remove(r){
  if (!await confirmDlg(`Excluir este registro de ${SINGULAR[table].toLowerCase()}? Esta ação não pode ser desfeita.`)) return;
  try { await api(`rows/${table}?pk=${encodeURIComponent(JSON.stringify(pkOf(r)))}`, "DELETE"); toast("Registro excluído"); closeDrawer(true); load(); }
  catch (e) { toast(e.message, true); }
}

/* ---------- painel lateral (formulário) ---------- */
async function openDrawer(r){
  const t = S[table]; ed = r; dirty = false;
  for (const c of t.cols) if (c.fk && !opts[c.fk.table]) opts[c.fk.table] = await api("options/" + c.fk.table);
  const fields = t.cols.filter(c => !(t.auto && c.pk)).map(c => {
    const v = r ? r[c.name] : (isBool(c) ? 1 : "");
    const ro = r && c.pk;
    let input;
    if (c.fk) input = `<select name="${c.name}" ${c.notnull ? "required" : ""} ${ro ? "disabled" : ""}><option value="">Selecione</option>${opts[c.fk.table].map(o => `<option value="${o.id}" ${String(o.id) === String(v) ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`;
    else if (isBool(c)) return `<div class="f"><label class="sw"><input type="checkbox" name="${c.name}" ${v ? "checked" : ""}> ${label(c)}</label></div>`;
    else if (isDate(c)) input = `<input type="date" name="${c.name}" value="${esc(v)}" ${c.notnull ? "required" : ""}>`;
    else if (c.type === "REAL" || c.type === "INTEGER") input = `<input type="number" step="${c.type === "REAL" ? "0.01" : "1"}" min="0" name="${c.name}" value="${esc(v)}" ${c.notnull ? "required" : ""}>`;
    else { const n = (c.type.match(/\((\d+)\)/) || [])[1]; input = `<input type="text" name="${c.name}" maxlength="${n || ""}" value="${esc(v)}" ${c.notnull ? "required" : ""}>`; }
    return `<div class="f ${ro ? "ro" : ""}"><label>${label(c)}${c.notnull ? " *" : ""}</label>${input}</div>`;
  }).join("");
  $("#drawer").innerHTML = `<header><h2>${SINGULAR[table]} ${ICONS.info}</h2><button class="x" id="close" aria-label="Fechar">×</button></header>
    <form id="form" novalidate><div class="tabs"><button type="button" class="on">Dados</button></div>${fields}</form>
    <div class="dfoot"><button class="btn primary" id="save" disabled>Salvar</button>${r ? `<button class="btn" id="del">Excluir</button>` : ""}<button class="link" id="cancel">Cancelar</button></div>`;
  $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); $("#drawer").setAttribute("aria-hidden", "false");
  const form = $("#form");
  form.oninput = form.onchange = () => { dirty = true; $("#save").disabled = false; };
  form.onsubmit = e => { e.preventDefault(); save(); };
  $("#save").onclick = save; $("#cancel").onclick = $("#close").onclick = () => closeDrawer();
  if (r) $("#del").onclick = () => remove(r);
  setTimeout(() => form.querySelector("input:not([type=checkbox]),select:not(:disabled)")?.focus(), 230);
}
function closeDrawer(force){
  if (!force && dirty && !confirm("Descartar as alterações não salvas?")) return;
  dirty = false; $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); $("#drawer").setAttribute("aria-hidden", "true");
}
async function save(){
  const form = $("#form"); form.querySelectorAll("small").forEach(s => s.remove());
  let bad = false;
  form.querySelectorAll("[required]").forEach(i => { if (!i.value && !i.disabled){ bad = true; i.parentElement.insertAdjacentHTML("beforeend", "<small>Campo obrigatório</small>"); } });
  if (bad) return;
  const data = {};
  for (const c of S[table].cols){ const el = form.elements[c.name]; if (!el || (el.disabled && ed)) continue; data[c.name] = isBool(c) ? (el.checked ? 1 : 0) : el.value; }
  try {
    await api(ed ? `rows/${table}?pk=${encodeURIComponent(JSON.stringify(pkOf(ed)))}` : "rows/" + table, ed ? "PUT" : "POST", data);
    toast(ed ? "Alterações salvas" : "Registro criado"); closeDrawer(true); load();
  } catch (e) { toast(e.message, true); }
}
$("#scrim").onclick = () => closeDrawer();
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#drawer").classList.contains("on") && !$("#dlg").open) closeDrawer(); });

/* ---------- consultas ---------- */
async function viewReports(){
  if (!reps.length){ reps = await api("reports"); rep = reps[0].id; }
  const groups = [...new Set(reps.map(r => r.group))];
  $("#view").innerHTML = `<div class="card"><header><h2>Consultas do banco</h2></header><div class="rep"><aside>${groups.map(g => `<h3>${g}</h3>` + reps.filter(r => r.group === g).map(r => `<button data-r="${r.id}" class="${r.id === rep ? "on" : ""}">${esc(r.title)}</button>`).join("")).join("")}</aside><section id="res"></section></div></div>`;
  document.querySelector(".rep aside").onclick = e => { const b = e.target.closest("button"); if (b){ rep = b.dataset.r; viewReports(); } };
  const d = await api("reports/" + rep), r = reps.find(x => x.id === rep);
  const money = c => /salario|media/.test(c) , pct = c => /percentual/.test(c);
  const fmt = (c, v) => v == null ? "" : pct(c) ? Number(v).toLocaleString("pt-BR") + "%" : money(c) && typeof v === "number" ? brl(v) : esc(v);
  const head = c => { const s = c.replace(/_/g, " "); return (WORDS[s] || s).replace(/^./, x => x.toUpperCase()).replace("salario", "salário").replace("funcionarios", "funcionários").replace("media", "média").replace("quantidade", "quantidade").replace("dependentes", "dependentes").replace("anos empresa", "anos de empresa").replace("departamento", "departamento"); };
  $("#res").innerHTML = `<h3>${esc(r.title)}</h3>` + (d.rows.length ? `<div class="tw"><table><thead><tr>${d.columns.map(c => `<th class="${money(c) || pct(c) ? "num" : ""}">${head(c)}</th>`).join("")}</tr></thead><tbody>${d.rows.map(row => `<tr>${row.map((v, i) => `<td class="${money(d.columns[i]) || pct(d.columns[i]) ? "num" : ""}">${fmt(d.columns[i], v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><div class="foot">${d.rows.length} resultados</div>`
    : `<div class="empty">Esta consulta não retornou resultados com os dados atuais.</div>`);
}

(async () => { S = await api("schema"); go(); })();
</script>
</body>
</html>
